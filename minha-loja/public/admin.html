<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Admin — Podlabz</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#0a0a0a;color:#f5f5f5;min-height:100vh}
.escondido{display:none!important}
.tela{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.box{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:2rem;max-width:400px;width:100%}
.logo{font-size:1.3rem;font-weight:900;font-style:italic;color:#fff;letter-spacing:-1px}
.logo span{font-size:.6rem;opacity:.5;font-style:normal;letter-spacing:2px;margin-left:.4rem}
.box label{display:block;font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.35rem;margin-top:.85rem}
.box input{width:100%;padding:.85rem 1rem;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f5f5f5;outline:none;font-size:1rem}
.box input:focus{border-color:#fff}
.btn-p{width:100%;padding:1rem;background:#fff;color:#000;border:0;border-radius:10px;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:1.25rem}
.btn-p:disabled{opacity:.5}
#msg{font-size:.85rem;margin-top:.75rem;min-height:1.2rem;text-align:center}
header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;background:#141414;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:5}
.btn-sair{background:transparent;border:1px solid #2a2a2a;color:#888;padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-size:.85rem}
.tabs{display:flex;gap:.25rem;padding:0 1rem;background:#141414;border-bottom:1px solid #2a2a2a;overflow-x:auto}
.tabs button{background:transparent;border:0;color:#888;padding:.9rem 1.1rem;cursor:pointer;font-weight:700;font-size:.85rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.ativo{color:#fff;border-bottom-color:#fff}
main{padding:1.25rem;max-width:1000px;margin:0 auto}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.card h3{margin:0 0 .5rem;color:#fff;font-size:1rem}
.meta{color:#888;font-size:.85rem;line-height:1.6}
.tag{display:inline-block;padding:.25rem .65rem;border-radius:20px;font-size:.7rem;font-weight:800;text-transform:uppercase}
.tag.pendente{background:rgba(255,193,7,.15);color:#ffc107}
.tag.pago{background:rgba(37,211,102,.15);color:#25d366}
.tag.enviado{background:rgba(33,150,243,.15);color:#2196f3}
.tag.cancelado{background:rgba(229,57,53,.15);color:#e53935}
.acoes{display:flex;gap:.5rem;margin-top:.85rem;flex-wrap:wrap}
.acoes button{padding:.5rem .9rem;border-radius:8px;border:1px solid #2a2a2a;background:#1a1a1a;color:#f5f5f5;cursor:pointer;font-size:.8rem;font-weight:600}
.acoes button.ok{background:#fff;color:#000;border-color:#fff}
.acoes button.perigo{color:#e53935;border-color:rgba(229,57,53,.4)}
.vazio{text-align:center;color:#666;padding:3rem 1rem}
</style>
</head>
<body>

<div id="tela-login" class="tela">
  <div class="box">
    <div class="logo">PODLABZ<span>ADMIN</span></div>
    <h2 style="font-size:.95rem;color:#888;font-weight:500;margin:.25rem 0 1.5rem">Painel de controle</h2>
    <label>Senha</label>
    <input id="senha" type="password" placeholder="Digite a senha" autocomplete="current-password">
    <button id="btn-login" class="btn-p">Entrar</button>
    <p id="msg"></p>
  </div>
</div>

<div id="painel" class="escondido">
  <header>
    <div class="logo">PODLABZ<span>ADMIN</span></div>
    <button id="btn-sair" class="btn-sair">Sair</button>
  </header>
  <div class="tabs">
    <button data-tab="pedidos" class="ativo">📦 Pedidos</button>
    <button data-tab="produtos">🏷️ Produtos</button>
  </div>
  <main>
    <section id="tab-pedidos"><div class="vazio">Carregando...</div></section>
    <section id="tab-produtos" class="escondido"><div class="vazio">Carregando...</div></section>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
