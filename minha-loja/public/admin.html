<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Admin — Podlabz</title>
<link rel="stylesheet" href="style.css">
<style>
.tela{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.tela.escondido{display:none!important}
.box{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:2rem;max-width:400px;width:100%}
.logo{font-size:1.5rem;font-weight:900;font-style:italic;color:#fff;letter-spacing:-1px;margin-bottom:.25rem}
.logo span{font-size:.6rem;opacity:.5;font-style:normal;letter-spacing:2px;margin-left:.4rem}
.box h2{font-size:1rem;color:#888;font-weight:500;margin:0 0 1.5rem}
.box label{display:block;font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:.35rem}
.box input{width:100%;padding:.85rem 1rem;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f5f5f5;outline:none;font-size:1rem}
.box input:focus{border-color:#fff}
.btn-primario{width:100%;padding:1rem;background:#fff;color:#000;border:0;border-radius:10px;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:1.25rem}
.btn-primario:disabled{opacity:.5}
#msg{font-size:.85rem;margin-top:.75rem;min-height:1.2rem;text-align:center}
</style>
</head>
<body>

<div id="tela-login" class="tela">
  <div class="box">
    <div class="logo">PODLABZ<span>ADMIN</span></div>
    <h2>Painel de controle</h2>
    <label>Senha</label>
    <input id="senha" type="password" placeholder="Digite a senha" autocomplete="current-password">
    <button id="btn-login" class="btn-primario">Entrar</button>
    <p id="msg"></p>
  </div>
</div>

<div id="painel" class="escondido">
  <header style="display:flex;justify-content:space-between;padding:1rem 1.5rem;background:#141414;border-bottom:1px solid #2a2a2a">
    <div class="logo" style="font-size:1.1rem">PODLABZ<span>ADMIN</span></div>
    <button id="btn-sair" style="background:transparent;border:1px solid #2a2a2a;color:#888;padding:.5rem .9rem;border-radius:8px;cursor:pointer">Sair</button>
  </header>
  <div style="padding:2rem;text-align:center;color:#888">
    <p style="font-size:1.2rem;color:#fff">✅ Logado!</p>
    <p>Painel administrativo.</p>
    <div style="margin-top:2rem;display:grid;gap:.75rem;max-width:400px;margin-left:auto;margin-right:auto">
      <a href="/" style="padding:.85rem;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;text-decoration:none">🏠 Voltar ao site</a>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
